# Render Blueprint: one free web service.
# Free services have no disk, so the SQLite database and uploaded photos reset whenever the
# service restarts or wakes from sleep. The demo sofa listing is re-created automatically on start.
# For data that survives restarts: set plan to "starter" and add a disk mounted at /var/data,
# then point DATABASE_PATH and UPLOADS_PATH there.
services:
  - type: web
    name: dealhold
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "1"
      - key: PAYPAL_API
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Seller push notifications (copy from your local .env)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
